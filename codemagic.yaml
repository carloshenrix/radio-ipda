workflows:
  android-workflow:
    name: Android (APK)
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Instalar pacotes
        script: flutter pub get
      - name: Gerar APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

  ios-workflow:
    name: iOS (teste de compilação, sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar pacotes
        script: flutter pub get
      - name: Instalar dependencias do iOS
        script: |
          cd ios
          pod install
      - name: Compilar iOS sem assinatura
        script: flutter build ios --release --no-codesign
    artifacts:
      - /tmp/xcodebuild_logs/*.log